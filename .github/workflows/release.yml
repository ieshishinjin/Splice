name: Create Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Build
        run: ./gradlew shadowJar test --no-daemon

      - name: Generate checksums
        id: checksum
        run: |
          cd build/libs
          jar=$(ls Splice-*-all.jar | head -1)
          sha=$(sha256sum "$jar" | awk '{print $1}')
          echo "SHA=$sha" >> "$GITHUB_OUTPUT"
          echo "JAR=$jar" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        run: |
          TAG="${{ github.ref_name }}"
          prev=$(git tag --sort=-v:refname | grep '^v[0-9]' | grep -v "^$TAG$" | head -1)
          repo="${{ github.repository }}"

          # 从 CHANGELOG.md 提取当前版本更新内容
          awk -v ver="$TAG" '
            index($0, ">" ver) == 1 {found=1; next}
            /^>/ && found {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_BODY.md

          # compare 和校验
          jar_name="${{ steps.checksum.outputs.JAR }}"
          sha="${{ steps.checksum.outputs.SHA }}"
          dl_url="https://github.com/$repo/releases/download/$TAG/$jar_name"

          {
            echo ""
            echo "---"
            echo ""
            echo "[File Changelog](https://github.com/$repo/compare/$prev...$TAG)"
            echo ""
            echo "| File | SHA-256 |"
            echo "| :--- | :--- |"
            echo "| [$jar_name]($dl_url) | \`$sha\` |"
          } >> RELEASE_BODY.md

      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" \
            build/libs/Splice-*-all.jar \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_BODY.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
