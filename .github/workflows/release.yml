name: Create Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Build
        run: ./gradlew shadowJar test --no-daemon

      - name: Generate checksums
        run: |
          cd build/libs
          for f in *.jar; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Extract changelog
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # 从 CHANGELOG.md 提取当前版本的更新内容（按 > v1.1.0 格式匹配）
          awk -v ver="> $TAG" '
            $0 == ver {found=1; next}
            /^> v/ && found {exit}
            found {print}
          ' CHANGELOG.md > CHANGELOG_SECTION.md

          # 生成 SHA-256 表格
          {
            echo ""
            echo "---"
            echo ""
            echo "### 文件校验"
            echo "| File | SHA-256 |"
            echo "| :--- | :--- |"
          } >> CHANGELOG_SECTION.md

          for f in build/libs/*.jar; do
            name=$(basename "$f")
            sha=$(cat "build/libs/$name.sha256" | awk "{print \$1}")
            echo "| $name | \`$sha\` |" >> CHANGELOG_SECTION.md
          done

      - name: Create Release
        run: |
          gh release create "${{ github.ref_name }}" \
            build/libs/*.jar \
            build/libs/*.sha256 \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGELOG_SECTION.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
