name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Build & Test
        run: ./gradlew shadowJar test --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Splice-${{ github.sha }}
          path: build/libs/Splice-*-all.jar
